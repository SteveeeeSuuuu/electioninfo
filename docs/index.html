<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>查詢你的民意代表</title>
<meta name="description" content="依縣市與選區查詢立法委員與縣市議員，並連結到《報導者觀測站》查看議案與發言。">
<style>
  :root {
    --bg: #f7f5f2; --surface: #ffffff; --text: #1f1d1a; --muted: #6b665f;
    --line: #ddd8d0; --accent: #9f7544; --accent-ink: #ffffff; --warn-bg: #fff6e5; --warn-line: #e8c98f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --surface: #201e1b; --text: #ece8e2; --muted: #a39d94;
      --line: #3a3631; --accent: #d1a46e; --accent-ink: #161513; --warn-bg: #2b2418; --warn-line: #6b5429;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 24px; }
  .notice {
    background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px;
    padding: 10px 14px; font-size: .9rem; margin-bottom: 24px;
  }
  .pickers { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px;
  }
  select:disabled { opacity: .5; }
  select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #result { margin-top: 28px; display: grid; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h2 { margin: 0; font-size: 1.25rem; }
  .meta { color: var(--muted); font-size: .9rem; margin: 2px 0 12px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-block; text-decoration: none; border-radius: 8px; padding: 8px 14px; font-size: .9rem;
    border: 1px solid var(--accent); color: var(--accent);
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .empty { color: var(--muted); }
  footer { margin-top: 48px; font-size: .8rem; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>查詢你的民意代表</h1>
  <p class="lede">選擇縣市、類別與選區，找到你的立法委員或議員，再到《報導者觀測站》查看他們的議案與發言。</p>
  <div id="notice" class="notice" hidden></div>

  <div class="pickers">
    <label>縣市
      <select id="city"><option value="">請選擇</option></select>
    </label>
    <label>類別
      <select id="role" disabled><option value="">請選擇</option></select>
    </label>
    <label>選區
      <select id="district" disabled><option value="">請選擇</option></select>
    </label>
    <label>民意代表
      <select id="member" disabled><option value="">全部</option></select>
    </label>
  </div>

  <section id="result" aria-live="polite"></section>

  <footer>
    議案與發言內容由<a href="https://lawmaker.twreporter.org/" rel="noopener">《報導者觀測站》</a>提供，本頁僅提供連結，不轉載其內容。
    <span id="updated"></span>
  </footer>
</main>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const sel = { city: $("city"), role: $("role"), district: $("district"), member: $("member") };
  const result = $("result");
  let data;

  try {
    const res = await fetch("data/roster.json", { cache: "no-cache" });
    data = await res.json();
  } catch (e) {
    result.innerHTML = '<p class="empty">名單載入失敗，請稍後再試。</p>';
    return;
  }

  if (data.note) { $("notice").textContent = data.note; $("notice").hidden = !data.sample; }
  if (data.updated) $("updated").textContent = "名單更新日期：" + data.updated;

  const fill = (el, items, placeholder) => {
    el.innerHTML = "";
    el.append(new Option(placeholder, ""));
    items.forEach((t, i) => el.append(new Option(t, String(i))));
    el.disabled = items.length === 0;
  };
  const twSearch = (name) => "https://lawmaker.twreporter.org/search?query=" + encodeURIComponent(name);

  const city = () => data.cities[sel.city.value];
  const group = () => city() && city().groups[sel.role.value];
  const district = () => group() && group().districts[sel.district.value];

  fill(sel.city, data.cities.map(c => c.name + "（" + c.kind + "）"), "請選擇");
  sel.role.disabled = sel.district.disabled = sel.member.disabled = true;

  function render() {
    const d = district();
    result.innerHTML = "";
    if (!d) return;
    const pick = sel.member.value;
    const members = pick === "" ? d.members : [d.members[pick]];
    for (const m of members) {
      const card = document.createElement("article");
      card.className = "card";
      const h = document.createElement("h2"); h.textContent = m.name;
      const meta = document.createElement("p"); meta.className = "meta";
      meta.textContent = [m.party, city().name + " " + group().role + " " + d.name + (d.areas ? "（" + d.areas.join("、") + "）" : ""), m.term]
        .filter(Boolean).join("・");
      const links = document.createElement("div"); links.className = "links";
      const a = (href, text, primary) => {
        const x = document.createElement("a"); x.href = href; x.textContent = text;
        x.className = "btn" + (primary ? " primary" : ""); x.target = "_blank"; x.rel = "noopener";
        links.append(x);
      };
      a(m.twreporter || twSearch(m.name), "在《報導者觀測站》看議案與發言", true);
      if (m.official) a(m.official, "官方資料");
      card.append(h, meta, links);
      result.append(card);
    }
  }

  sel.city.onchange = () => {
    fill(sel.role, city() ? city().groups.map(g => g.role) : [], "請選擇");
    fill(sel.district, [], "請選擇"); fill(sel.member, [], "全部"); render();
  };
  sel.role.onchange = () => {
    fill(sel.district, group() ? group().districts.map(d => d.name + (d.areas ? "（" + d.areas.join("、") + "）" : "")) : [], "請選擇");
    fill(sel.member, [], "全部"); render();
  };
  sel.district.onchange = () => {
    fill(sel.member, district() ? district().members.map(m => m.name) : [], "全部"); render();
  };
  sel.member.onchange = render;
})();
</script>
</body>
</html>
